<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DJ Kelly Kay</title>
	<meta name="description" content="DJ Kelly Kay — official site. Coming soon.">
	<style>
		:root {
			--bg: #0b0b0f;
			--fg: #f4f4f5;
			--accent: #e0447c;
		}
		* { margin: 0; box-sizing: border-box; }
		body {
			min-height: 100svh;
			display: grid;
			place-items: center;
			background: radial-gradient(120% 120% at 50% 0%, #1a1023 0%, var(--bg) 60%);
			color: var(--fg);
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			text-align: center;
			padding: 2rem;
		}
		h1 {
			font-size: clamp(2.5rem, 8vw, 5rem);
			font-weight: 800;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}
		h1 span { color: var(--accent); }
		p {
			margin-top: 1rem;
			font-size: clamp(1rem, 2.5vw, 1.25rem);
			color: #a1a1aa;
			letter-spacing: 0.2em;
			text-transform: uppercase;
		}
	</style>
</head>
<body>
	<main>
		<h1>DJ <span>Kelly Kay</span></h1>
		<p>Coming soon</p>
	</main>
</body>
</html>
